name: Daily Case Tracking

on:
  schedule:
    # Daily at 4:00 AM HKT (20:00 UTC previous day)
    - cron: '0 20 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  track-cases:
    name: Track Legal Cases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # Required for creating issues on failure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm --filter=@looper-hq/database prisma generate

      - name: Verify Crawler Database Target
        run: pnpm run crawler:verify-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: Run Unified Tracker
        run: pnpm run crawler:all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          RSS_TIMEOUT: 30000
          RSS_MAX_RETRIES: 3
      
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Crawler] Daily Case Tracking Failed - ${date}`,
              body: `The daily case tracking job has failed.\n\n**Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Date:** ${date}\n\nPlease check the logs for details.`,
              labels: ['bug', 'crawler', 'automated']
            });
