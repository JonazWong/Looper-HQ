name: RSS News Crawler

# Daily RSS crawler - runs once per day at 4:30 AM HKT (20:30 UTC)
# Runs 30 minutes after daily case tracking

on:
  schedule:
    # Daily at 4:30 AM HKT (20:30 UTC) - 30 minutes after judiciary crawler
    - cron: '30 20 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  rss-crawler:
    name: Fetch RSS News
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm --filter=@looper-hq/database prisma generate

      - name: Verify Crawler Database Target
        run: pnpm run crawler:verify-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ensure RSS Sources Exist
        run: pnpm run crawler:ensure-sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run RSS Crawler
        run: pnpm run crawler:rss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          RSS_TIMEOUT: 30000
          RSS_MAX_RETRIES: 3
        timeout-minutes: 10

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Crawler] RSS Crawler Failed - ${date}`,
              body: `The RSS crawler job has failed.\n\n**Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Date:** ${date}\n\nPlease check the logs for details.`,
              labels: ['bug', 'crawler', 'automated']
            });
      
      - name: Summary
        run: |
          echo "✅ RSS crawler completed"
          echo "📊 Check workflow logs for details"
          echo "📝 Note: workflow now fails when all active RSS sources fail"
