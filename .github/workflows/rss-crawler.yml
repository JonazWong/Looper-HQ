name: RSS News Crawler

# Daily RSS crawler - runs once per day at 2:30 AM HKT (18:30 UTC)
# Adjusted from 15-minute interval to daily to reduce load and avoid rate limiting

on:
  schedule:
    # Daily at 2:30 AM HKT (18:30 UTC) - 30 minutes after daily case tracking
    - cron: '30 18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  rss-crawler:
    name: Fetch RSS News
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm --filter=@looper-hq/database prisma generate
      
      - name: Run RSS Crawler
        run: pnpm run crawler:rss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          RSS_TIMEOUT: 30000
          RSS_MAX_RETRIES: 3
        timeout-minutes: 10
        continue-on-error: true
      
      - name: Summary
        run: |
          echo "✅ RSS crawler completed"
          echo "📊 Check workflow logs for details"
          echo "📝 Note: Individual RSS source failures are logged but don't fail the workflow"
