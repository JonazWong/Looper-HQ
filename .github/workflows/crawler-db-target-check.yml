name: Crawler DB Target Check

on:
  workflow_dispatch:

jobs:
  verify-db-target:
    name: Verify Crawler Database Target
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Crawler Database Target
        run: pnpm run crawler:verify-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Summary
        run: |
          echo "✅ DATABASE_URL target validation passed"
          echo "ℹ️  This workflow only validates DB target and does not run crawler"