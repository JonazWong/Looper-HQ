name: Deploy to Digital Ocean App Platform

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: 20
  PNPM_VERSION: 8

jobs:
  # ============================================================================
  # Test & Build Stage
  # ============================================================================
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm --filter=@looper-hq/database prisma generate
      
      - name: Type check
        run: pnpm --filter=@looper-hq/web type-check
        continue-on-error: true
      
      - name: Lint code
        run: pnpm lint
        continue-on-error: true
      
      - name: Build application
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://test:test@localhost:5433/test
          NEXTAUTH_SECRET: test-secret-for-build-only
          NEXTAUTH_URL: http://localhost:3000
      
      - name: Run tests
        run: pnpm test
        continue-on-error: true

  # ============================================================================
  # Deploy to Digital Ocean App Platform
  # ============================================================================
  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Trigger Digital Ocean App Platform deployment
        id: deploy
        run: |
          echo "🚀 Triggering deployment to Digital Ocean App Platform..."
          
          # Update app spec to latest configuration
          doctl apps update ${{ secrets.DIGITALOCEAN_APP_ID }} --spec .do/app.yaml
          
          # Trigger a new deployment
          DEPLOYMENT_ID=$(doctl apps create-deployment ${{ secrets.DIGITALOCEAN_APP_ID }} --format ID --no-header)
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          
          echo "✅ Deployment triggered with ID: $DEPLOYMENT_ID"
          echo "📊 You can monitor the deployment at:"
          echo "   https://cloud.digitalocean.com/apps/${{ secrets.DIGITALOCEAN_APP_ID }}/deployments/$DEPLOYMENT_ID"
      
      - name: Wait for deployment to complete
        run: |
          echo "⏳ Waiting for deployment to complete..."
          echo "This may take 5-10 minutes..."
          
          # Wait for deployment to complete (timeout after 15 minutes)
          timeout 900 bash -c '
            while true; do
              STATUS=$(doctl apps list-deployments ${{ secrets.DIGITALOCEAN_APP_ID }} --format ID,Phase --no-header | grep "${{ steps.deploy.outputs.deployment_id }}" | awk "{print \$2}")
              
              echo "Current status: $STATUS"
              
              if [ "$STATUS" = "ACTIVE" ]; then
                echo "✅ Deployment completed successfully!"
                exit 0
              elif [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "❌ Deployment failed with status: $STATUS"
                exit 1
              fi
              
              sleep 30
            done
          ' || {
            echo "⚠️ Deployment is taking longer than expected."
            echo "Check status at: https://cloud.digitalocean.com/apps/${{ secrets.DIGITALOCEAN_APP_ID }}"
            exit 1
          }
      
      - name: Get deployment URL
        id: app_url
        run: |
          APP_URL=$(doctl apps get ${{ secrets.DIGITALOCEAN_APP_ID }} --format DefaultIngress --no-header)
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "🌐 Application URL: https://$APP_URL"
      
      - name: Verify deployment health
        run: |
          echo "🔍 Verifying deployment health..."
          sleep 30  # Wait for health checks to stabilize
          
          # Check health endpoint
          HEALTH_URL="https://${{ steps.app_url.outputs.app_url }}/api/health"
          
          for i in {1..10}; do
            echo "Attempt $i/10: Checking $HEALTH_URL"
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed!"
              
              # Get detailed health status
              HEALTH_DATA=$(curl -s "$HEALTH_URL")
              echo "📊 Health Status:"
              echo "$HEALTH_DATA" | jq '.' || echo "$HEALTH_DATA"
              
              exit 0
            fi
            
            echo "⚠️ Health check returned: $RESPONSE"
            sleep 15
          done
          
          echo "❌ Health check failed after 10 attempts"
          echo "⚠️ Please verify deployment manually"
          exit 1
      
      - name: Deployment summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📍 Application URL:"
          echo "   https://${{ steps.app_url.outputs.app_url }}"
          echo ""
          echo "🔗 Digital Ocean Console:"
          echo "   https://cloud.digitalocean.com/apps/${{ secrets.DIGITALOCEAN_APP_ID }}"
          echo ""
          echo "🏥 Health Check:"
          echo "   https://${{ steps.app_url.outputs.app_url }}/api/health"
          echo ""
          echo "📊 Deployment ID:"
          echo "   ${{ steps.deploy.outputs.deployment_id }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Failure notification
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ Deployment Failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔍 Troubleshooting steps:"
          echo "1. Check Digital Ocean logs:"
          echo "   https://cloud.digitalocean.com/apps/${{ secrets.DIGITALOCEAN_APP_ID }}"
          echo ""
          echo "2. Verify environment variables are set correctly"
          echo ""
          echo "3. Check database connectivity and migrations"
          echo ""
          echo "4. Review build logs for errors"
          echo ""
          echo "5. Ensure Dockerfile builds successfully locally"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ============================================================================
# Required GitHub Secrets
# ============================================================================
# Set these in: GitHub Repository → Settings → Secrets and variables → Actions
#
# REQUIRED:
# - DIGITALOCEAN_ACCESS_TOKEN: Your DO API token
#   Generate at: https://cloud.digitalocean.com/account/api/tokens
#
# - DIGITALOCEAN_APP_ID: Your DO App Platform app ID
#   Find in DO Console URL or run: doctl apps list
#
# OPTIONAL (set in DO App Platform UI instead):
# - Database, auth, and API keys should be configured in DO App Platform
#   under Settings → App-Level Environment Variables
# ============================================================================
