# =============================================================================
# Looper HQ - Development Overrides
# =============================================================================
# Development-specific configuration overrides for Docker Compose
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Applications use local development server instead of Docker
  web:
    profiles:
      - disabled

  legal:
    profiles:
      - disabled

  # PostgreSQL - Development Configuration
  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    # Expose on all interfaces for local development
    ports:
      - "5432:5432"

  # Redis - Development Configuration
  redis:
    # Expose on all interfaces for local development
    ports:
      - "6379:6379"

  # Keycloak - Development Configuration
  keycloak:
    # Expose on all interfaces for local development
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true

  # pgAdmin - Always available in development
  pgadmin:
    profiles: []
