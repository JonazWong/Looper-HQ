name: looper-hq
region: sgp

services:
  - name: web
    # Source directory - CRITICAL: Must be root for monorepo
    source_dir: /
    
    github:
      repo: JonazWong/Looper-HQ
      branch: main
      deploy_on_push: true
    
    # Force Docker build (disable buildpack auto-detection)
    dockerfile_path: Dockerfile
    
    # Port configuration (Dockerfile exposes 3005)
    http_port: 3005
    
    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xs

    health_check:
      http_path: /api/health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    
    # Environment variables for web service
    envs:
      # =====================================
      # Database Configuration (Auto-injected)
      # =====================================
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${db.DATABASE_URL}
      
      # =====================================
      # Node Environment
      # =====================================
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      
      - key: TZ
        scope: RUN_AND_BUILD_TIME
        value: Asia/Hong_Kong
      
      # =====================================
      # NextAuth Configuration
      # REQUIRED: Set in DO App Platform UI
      # =====================================
      - key: NEXTAUTH_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      
      - key: NEXTAUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        # MUST BE SET IN DO CONSOLE - Generate with: openssl rand -base64 32
      
      # =====================================
      # Keycloak OAuth (Optional)
      # Set these if using Keycloak authentication
      # =====================================
      - key: KEYCLOAK_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        # Optional - for OAuth integration
      
      - key: KEYCLOAK_ISSUER
        scope: RUN_AND_BUILD_TIME
        # Optional - e.g., https://your-keycloak.com/realms/looper-hq
      
      # =====================================
      # AI Provider Configuration
      # REQUIRED: Set OpenAI/OpenRouter API key
      # =====================================
      - key: AI_PROVIDER
        scope: RUN_AND_BUILD_TIME
        value: openai
      
      - key: OPENAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # MUST BE SET IN DO CONSOLE - Your OpenAI or OpenRouter API key
      
      - key: OPENAI_MODEL
        scope: RUN_AND_BUILD_TIME
        value: gpt-4o-mini
      
      - key: OPENAI_BASE_URL
        scope: RUN_AND_BUILD_TIME
        value: https://openrouter.ai/api/v1
      
      - key: AI_MAX_TOKENS
        scope: RUN_AND_BUILD_TIME
        value: "2048"
      
      - key: AI_TEMPERATURE
        scope: RUN_AND_BUILD_TIME
        value: "0.3"
      
      - key: AI_DEFAULT_LOCALE
        scope: RUN_AND_BUILD_TIME
        value: zh-HK
      
      # =====================================
      # Crawler Configuration
      # =====================================
      - key: CRAWLER_ENABLED
        scope: RUN_AND_BUILD_TIME
        value: "true"
      
      - key: CRAWLER_SCHEDULE
        scope: RUN_AND_BUILD_TIME
        value: "0 18 * * *"  # Daily at 2am HKT (18:00 UTC previous day)
      
      - key: RSS_TIMEOUT
        scope: RUN_AND_BUILD_TIME
        value: "30000"
      
      - key: RSS_MAX_RETRIES
        scope: RUN_AND_BUILD_TIME
        value: "3"

