name: looper-hq
region: sgp

services:
  - name: web
    github:
      repo: JonazWong/Looper-HQ
      branch: main
      deploy_on_push: true
    build_command: pnpm install && pnpm build --filter=@looper-hq/web
    run_command: cd apps/web && pnpm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs

    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10

    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEXTAUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET

databases:
  - name: db
    engine: PG
    version: "15"
