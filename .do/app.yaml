name: looper-hq
region: sgp

services:
  - name: web
    github:
      repo: JonazWong/Looper-HQ
      branch: main
      deploy_on_push: true
    build_command: pnpm install && pnpm build --filter=@looper-hq/web
    run_command: cd apps/web && pnpm start
    http_port: 3000
    
    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xs

    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10

    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEXTAUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET

databases:
  - name: db
    engine: PG

    production: true
    cluster_name: looper-hq-prod
    db_name: looper_hq
    db_user: looper_hq_user

# Alerts
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: CPU_UTILIZATION
    value: 80
  - rule: MEMORY_UTILIZATION
    value: 80
  - rule: RESTART_COUNT
    value: 5
