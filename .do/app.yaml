databases:
- cluster_name: db-postgresql-sgp1-75753
  db_name: defaultdb
  db_user: doadmin
  engine: PG
  name: db-postgresql-sgp1-75753
  production: true
  version: "16"
ingress:
  rules:
  - component:
      name: web
    match:
      path:
        prefix: /
name: looper-hq
region: sgp
services:
- dockerfile_path: Dockerfile
  envs:
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: TZ
    scope: RUN_AND_BUILD_TIME
    value: Asia/Hong_Kong
  - key: NEXTAUTH_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_URL}
  - key: NEXTAUTH_SECRET
    scope: RUN_TIME
    type: SECRET
    value: EV[1:a+xxK+RdpAWW8EiZXar3VPDGqTUabI/W:KhEkutPVg790uZfoKohPoA==]
  - key: KEYCLOAK_CLIENT_ID
    scope: RUN_AND_BUILD_TIME
  - key: KEYCLOAK_ISSUER
    scope: RUN_AND_BUILD_TIME
  - key: AI_PROVIDER
    scope: RUN_AND_BUILD_TIME
    value: openai
  - key: OPENAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:GK9PI1btiFluEcFrVraVr0qK0MDeLORf:S8a5viNg50y36Is4JohuJA==]
  - key: OPENAI_MODEL
    scope: RUN_AND_BUILD_TIME
    value: gpt-4o-mini
  - key: OPENAI_BASE_URL
    scope: RUN_AND_BUILD_TIME
    value: https://openrouter.ai/api/v1
  - key: AI_MAX_TOKENS
    scope: RUN_AND_BUILD_TIME
    value: "2048"
  - key: AI_TEMPERATURE
    scope: RUN_AND_BUILD_TIME
    value: "0.3"
  - key: AI_DEFAULT_LOCALE
    scope: RUN_AND_BUILD_TIME
    value: zh-HK
  - key: CRAWLER_ENABLED
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: CRAWLER_SCHEDULE
    scope: RUN_AND_BUILD_TIME
    value: 0 18 * * *
  - key: RSS_TIMEOUT
    scope: RUN_AND_BUILD_TIME
    value: "30000"
  - key: RSS_MAX_RETRIES
    scope: RUN_AND_BUILD_TIME
    value: "3"
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db-postgresql-sgp1-75753.DATABASE_URL}
  github:
    branch: main
    deploy_on_push: true
    repo: JonazWong/Looper-HQ
  health_check:
    failure_threshold: 3
    http_path: /api/health
    initial_delay_seconds: 60
    period_seconds: 30
    success_threshold: 1
    timeout_seconds: 10
  http_port: 3005
  instance_count: 1
  instance_size_slug: basic-xs
  name: web
  source_dir: /
