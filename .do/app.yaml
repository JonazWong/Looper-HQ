    value: "3"
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db-postgresql-sgp1-75753.DATABASE_URL}
  github:
    branch: main
    deploy_on_push: true
    repo: JonazWong/Looper-HQ
  http_port: 3000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  name: looper-hq
  source_dir: /
- dockerfile_path: /Dockerfile.legal-case-search
  envs:
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: TZ
    scope: RUN_AND_BUILD_TIME
